<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro SUS</title>

    <link
        rel="stylesheet"
        href="CSS/Style.css">

</head>

<body>

    <main id="div4">

        <h1>CRIAR CADASTRO</h1>

        <br>

        <!-- ========================= -->
        <!-- NOME -->
        <!-- ========================= -->

        <div class="campo">

            <label for="nome">

                Nome Completo

            </label>

            <input

                type="text"

                id="nome"

                name="nome"

                placeholder="Digite seu nome completo"

                minlength="5"

                maxlength="67"

                required

            >

        </div>

        <br>

        <!-- ========================= -->
        <!-- EMAIL -->
        <!-- ========================= -->

        <div class="campo">

            <label for="email">

                E-mail

            </label>

            <input

                type="email"

                id="email"

                name="email"

                placeholder="Digite seu e-mail"

                autocomplete="email"

                required

            >

        </div>

        <br>

                <!-- ========================= -->
        <!-- SENHA -->
        <!-- ========================= -->

        <div class="campo">

            <label for="senha">

                Senha

            </label>

            <input

                type="password"

                id="senha"

                name="senha"

                placeholder="Crie uma senha"

                minlength="8"

                maxlength="24"

                autocomplete="new-password"

                required

            >

        </div>

        <br>

        <!-- ========================= -->
        <!-- CONFIRMAR SENHA -->
        <!-- ========================= -->

        <div class="campo">

            <label for="confirmarSenha">

                Confirmar Senha

            </label>

            <input

                type="password"

                id="confirmarSenha"

                name="confirmarSenha"

                placeholder="Confirme sua senha"

                minlength="8"

                maxlength="24"

                autocomplete="new-password"

                required

            >

        </div>

        <br>

        <!-- ========================= -->
        <!-- DATA DE NASCIMENTO -->
        <!-- ========================= -->

        <div class="campo">

            <label for="dataNascimento">

                Data de Nascimento

            </label>

            <input

                type="date"

                id="dataNascimento"

                name="dataNascimento"

                required

            >

        </div>

        <br>

        <!-- ========================= -->
        <!-- CPF -->
        <!-- ========================= -->

        <div class="campo">

            <label for="cpf">

                CPF

            </label>

            <input

                type="text"

                id="cpf"

                name="cpf"

                placeholder="Digite seu CPF"

                maxlength="11"

                inputmode="numeric"

                required

            >

        </div>

        <br>

                <!-- ========================= -->
        <!-- BOTÕES -->
        <!-- ========================= -->

        <div class="botoes">

            <button

                type="button"

                id="limpar">

                Limpar

            </button>

            <button

                type="button"

                id="btnCadastrar">

                Cadastrar

            </button>

        </div>

        <br>

        <!-- ========================= -->
        <!-- VOLTAR AO LOGIN -->
        <!-- ========================= -->

        <div class="voltarLogin">

            <a href="index.html">

                ← Voltar para o Login

            </a>

        </div>

    </main>

        <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script type="module" src="JS/Script.js"></script>

</body>

</html>
