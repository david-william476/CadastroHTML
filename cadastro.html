<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Cadastros</title>

    <link rel="stylesheet" href="CSS/Style.css">
    <script src="JS/Script.js"></script>
</head>

<body>

   <div id="div4"> 

    <h1>CRIAR CADASTRO</h1>
    <br>
    
 <div class="campo">
    <label>Nome Completo</label>
    <input type="text"
     id="nome"
     name="nome" 
     placeholder="Digite seu nome completo" 
     minlength="5"
    maxlength="67">
</div>


<br>
    <div class="campo">
    <label>E-mail</label>
    <input type="email" 
     id="email"
     name="email" 
     placeholder="Digite seu e-mail">
    </div>


<br>
<div class="campo">
    <label>Senha</label>
    <input type="password" 
     id="senha"
     name="password" 
     placeholder="Crie uma senha" 
     minlength="8" 
     maxlength="24">
</div>
<br>


    <div class="campo">
        <label>Confirme sua senha</label>
        <input type="password" 
         id="confirmarSenha"
         name="confirmarSenha" 
         placeholder="Confirme sua senha" 
         minlength="8" 
         maxlength="24">
    </div>

 <br>
    
    <div class="campo">
        <label>Data de Nascimento</label>
        <input type="date" 
         id="dataNascimento"
         name="data" 
         placeholder="Digite sua data de nascimento">
    </div>
    <br>

    <div class="campo">
        <label>CPF</label>
        <input
    type="text"
    id="cpf"
    name="cpf"
    placeholder="Digite seu CPF"
    maxlength="11">
    </div>
<br>

    <div class="botoes">
    <button id="limpar">Limpar</button>

    <button id="btnCadastrar" onclick="cadastrar()">
        Cadastrar
    </button>
</div>

   </div>

</body>
</html>
