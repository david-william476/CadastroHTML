<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login SUS</title>

    <link
        rel="stylesheet"
        href="CSS/Style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <main id="div1">

        <h1>LOGIN SUS</h1>

        <br>

        <div class="campo">

            <label for="email">

                E-mail

            </label>

            <input

                type="email"

                id="email"

                name="email"

                placeholder="Digite seu e-mail"

                autocomplete="email"

            >

        </div>

                <br>

        <div class="campo">

            <label for="senha">

                Senha

            </label>

            <input

                type="password"

                id="senha"

                name="password"

                placeholder="Digite sua senha"

                autocomplete="current-password"

            >

        </div>

        <br><br>

        <button type="button" id="btnLogin">

            Entrar

        </button>

    </main>

    <!-- ========================= -->
    <!-- CADASTRO -->
    <!-- ========================= -->

    <section id="div2">

        <p>

            Não possui cadastro?

            <a href="cadastro.html">

                Faça seu cadastro

            </a>

        </p>

    </section>

        <!-- ========================= -->
    <!-- RECUPERAR SENHA -->
    <!-- ========================= -->

    <section id="div3">

        <p>

            Esqueceu sua senha?

            <a href="recupera.html">

                Recuperar senha

            </a>

        </p>

    </section>


    <!-- ========================= -->
    <!-- ACESSO À TABELA -->
    <!-- ========================= -->

    <a
        href="tabela.html"
        id="btnTabela">

        Cadastros

    </a>

        <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script type="module" src="JS/Script.js"></script>

</body>

</html>
